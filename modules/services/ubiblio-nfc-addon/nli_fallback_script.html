<script>
  function nliTitleLookup() {
    const title = document.getElementById("nliTitleInput").value.trim();
    const author = document.getElementById("nliAuthorInput").value.trim();
    const code = document.getElementById("nliCodeInput").value.trim();

    if (!title) {
      return;
    }

    const params = new URLSearchParams({ title: title });
    if (author) params.set("author", author);
    if (code) params.set("code", code);
    window.location.href = "/nliTitle?" + params.toString();
  }
</script>
